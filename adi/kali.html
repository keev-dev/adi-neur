<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adi · Kali</title>
<style>
  :root{--bg:#06080c;--panel:#0b0f15;--line:#182130;--text:#c6d2e2;--dim:#66758a;--amber:#ffb454;--green:#3ddc97;--red:#ff5f6d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:18px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a0e14,#070a0f)}
  .brand{font-weight:700;letter-spacing:.22em;color:var(--amber)}
  .brand span{color:var(--dim);font-weight:400;letter-spacing:.1em;margin-left:4px}
  .meta{color:var(--dim);flex:1}
  .meta b{color:var(--text)}
  nav a{color:var(--dim);text-decoration:none;margin-left:14px}
  nav a:hover{color:var(--text)}
  .wrap{padding:14px 16px;overflow-x:auto}
  .bar{display:flex;align-items:center;gap:14px;margin-bottom:10px;color:var(--dim)}
  .bar label{cursor:pointer}
  .bar select{background:#0e131b;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:inherit;font-size:11px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;position:sticky;top:0;background:var(--bg)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  th.mix,td.mix{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#0e131b}
  tr.top td{background:rgba(255,180,84,.07)}
  tr.dead{opacity:.32}
  tr.dead td{color:#36414f}
  .mix{color:#8fa0b5;font-size:11px}
  .note{color:#3a4a5f;margin-top:12px;font-size:10px}
</style>
</head>
<body>
<header>
  <div class="brand">ADI <span>kali</span></div>
  <div class="meta" id="meta">...</div>
  <nav><a href="/">map</a><a href="/stats">stats</a></nav>
</header>
<div class="wrap">
  <div class="bar">
    <label><input type="checkbox" id="all" /> show empty seats</label>
    <label>sort
      <select id="sort">
        <option value="eaten">food eaten</option>
        <option value="coverage">coverage</option>
        <option value="rate">rate</option>
        <option value="gen">generation</option>
      </select>
    </label>
    <span>click a row to focus that seat on the map</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>seat</th><th>name</th><th>id</th><th>gen</th><th>age</th><th>energy</th><th>cap</th>
        <th>eaten</th><th>rate</th><th>cover</th><th>path</th><th class="mix">actions</th><th>err</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="note">rate = cells eaten per 1,000 steps. cover = visited cells / all cells. actions = forward, left, right, eat.</div>
</div>
<script>
const $ = id => document.getElementById(id);
async function tick(){
  try{
    const d = await (await fetch('/state')).json();
    const s = d.stats;
    $('meta').innerHTML = `step <b>${d.step.toLocaleString()}</b> · pop <b>${s.pop}</b> · gen <b>${s.max_gen}</b> · best <b>${s.best_eaten.toFixed(0)}</b>`;
    const showAll = $('all').checked;
    const key = $('sort').value;
    const rows = d.roster.filter(r => showAll || r.alive).slice().sort((a,b) => (b[key]||0) - (a[key]||0));
    const top = rows.length ? rows[0].eaten : 0;
    $('rows').innerHTML = rows.map(r => {
      const p = r.probs || [0.25,0.25,0.25,0.25];
      const act = ["F","L","R","E"].map((k,i) => `${k}${p[i].toFixed(2)}`).join(" ");
      const cls = !r.alive ? "dead" : (r.eaten === top && top > 0 ? "top" : "");
      return `<tr class="${cls}" data-slot="${r.slot}">
        <td>${r.slot}</td>
        <td><b style="color:hsl(${r.hue} 75% 66%)">${r.name}</b></td>
        <td>${r.id}</td><td>${r.gen}</td><td>${r.age}</td><td>${r.energy.toFixed(1)}</td>
        <td>${(r.cap || 0).toFixed(4)}</td>
        <td>${r.eaten}</td><td>${(r.rate||0).toFixed(1)}</td>
        <td>${((r.coverage||0)*100).toFixed(1)}%</td><td>${(r.path||0).toFixed(0)}</td>
        <td class="mix">${act}</td><td>${(r.pred_err||0).toFixed(4)}</td>
      </tr>`;
    }).join("");
    document.querySelectorAll('#rows tr').forEach(tr => {
      tr.onclick = () => fetch('/cmd', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({cmd:'focus', slot:+tr.dataset.slot})
      });
    });
  }catch(e){}
}
setInterval(tick, 1000); tick();
</script>
</body>
</html>
