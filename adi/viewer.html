<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adi</title>
<style>
  :root{
    --bg:#06080c; --panel:#0b0f15; --panel2:#0e131b; --line:#182130;
    --text:#c6d2e2; --dim:#66758a; --faint:#2a3648;
    --amber:#ffb454; --green:#3ddc97; --blue:#5aa9ff; --red:#ff5f6d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing:antialiased;
  }
  header{
    height:44px; display:flex; align-items:center; gap:16px;
    padding:0 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0a0e14,#070a0f);
  }
  .brand{font-weight:700; letter-spacing:.22em; font-size:12px; color:var(--amber)}
  .brand span{color:var(--dim); font-weight:400; letter-spacing:.1em; margin-left:4px}
  .stats{display:flex; gap:14px; color:var(--dim); flex:1; overflow:hidden; white-space:nowrap}
  .stats b{color:var(--text); font-weight:600}
  .stats i{font-style:normal; color:var(--faint); margin-right:4px}
  .links{display:flex; gap:12px; margin-left:8px}
  .links a{color:var(--dim); text-decoration:none; font-size:11px; letter-spacing:.04em}
  .links a:hover{color:var(--text)}
  .controls{display:flex; gap:4px; align-items:center}
  button{
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:5px; padding:5px 9px; font:inherit; font-size:11px; cursor:pointer;
  }
  button:hover{color:var(--text); border-color:#243146}
  button.on{color:#06080c; background:var(--amber); border-color:var(--amber); font-weight:700}
  .toolbar{
    height:36px; display:flex; align-items:center; gap:14px; padding:0 16px;
    border-bottom:1px solid var(--line); background:#080b10;
  }
  .toolbar label{display:flex; align-items:center; gap:5px; color:var(--dim); font-size:10px; letter-spacing:.05em}
  .toolbar select{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:3px 5px; font:inherit; font-size:11px; cursor:pointer;
  }
  .toolbar select:disabled{opacity:.4; cursor:default}
  .phase{color:var(--dim); font-size:10px; letter-spacing:.08em; text-transform:uppercase}
  .spacer{flex:1}
  main{
    display:grid; grid-template-columns:1.28fr 1fr; gap:10px;
    padding:10px; height:calc(100vh - 80px);
  }
  main.brain-off{grid-template-columns:1fr}
  main.brain-off .right{display:none}
  .pane{
    position:relative; background:radial-gradient(120% 100% at 50% 0%,#0c1119,#06080c 70%);
    border:1px solid var(--line); border-radius:9px; overflow:hidden; min-height:0;
    display:flex; flex-direction:column;
  }
  #world{flex:1; min-height:0; width:100%; display:block}
  .hud{
    position:absolute; left:12px; top:10px; display:flex; flex-direction:column; gap:2px;
    pointer-events:none; text-shadow:0 1px 6px #000;
  }
  .hud .k{color:#5c6b80; font-size:10px; letter-spacing:.12em; text-transform:uppercase}
  .hud .v{color:var(--text); font-size:15px; letter-spacing:.04em}
  .hud .v em{font-style:normal; color:var(--dim); font-size:11px; margin-left:8px}
  .legend{
    position:absolute; left:12px; bottom:44px; display:flex; gap:14px;
    color:var(--dim); font-size:10px; pointer-events:none;
  }
  .legend s{text-decoration:none; display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px; vertical-align:1px}
  .foot{position:absolute; right:12px; bottom:44px; color:var(--faint); font-size:10px; letter-spacing:.05em}
  .seatbar{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:4px 8px;
    border-top:1px solid var(--line); background:#080b10;
  }
  .seatbar select{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:3px 6px; font:inherit; font-size:11px; min-width:130px;
  }
  .seatbar button{padding:3px 8px}
  .seatbar .meta{color:var(--dim); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .right{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; min-height:0}
  .card{
    display:flex; flex-direction:column; min-height:0; min-width:0;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px 8px;
  }
  .card h3{
    margin:0 0 6px; font-size:9px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--dim); font-weight:600; display:flex; justify-content:space-between;
  }
  .card h3 span{color:var(--faint); letter-spacing:.05em; text-transform:none; font-weight:400}
  .card canvas{flex:1; min-height:0; width:100%; display:block}
</style>
</head>
<body>
<header>
  <div class="brand">ADI <span>v0</span></div>
  <div class="stats" id="stats"></div>
  <nav class="links"><a href="/kali">kali</a><a href="/stats">stats</a></nav>
  <div class="controls">
    <button data-speed="1">1x</button>
    <button data-speed="2">2x</button>
    <button data-speed="4">4x</button>
    <button data-speed="0">max</button>
    <button id="pause">pause</button>
  </div>
</header>

<div class="toolbar">
  <label>birth
    <select id="birthmode">
      <option value="weakest">weakest</option>
      <option value="threshold">threshold</option>
      <option value="oldest">oldest</option>
      <option value="off">off</option>
    </select>
  </label>
  <label>age
    <select id="maxage">
      <option value="0">off</option>
      <option value="6000">6k</option>
      <option value="8000">8k</option>
      <option value="12000">12k</option>
    </select>
  </label>
  <label>food
    <select id="density">
      <option value="0.05">5%</option>
      <option value="0.04">4%</option>
      <option value="0.03">3%</option>
      <option value="0.02">2%</option>
      <option value="0.01">1%</option>
      <option value="0.008">0.8%</option>
      <option value="0.006">0.6%</option>
      <option value="0.005">0.5%</option>
      <option value="0.004">0.4%</option>
    </select>
  </label>
  <button id="cycle">cycle off</button>
  <span class="phase" id="phase">lean</span>
  <span class="phase" id="foodnow">food 0.6%</span>
  <span class="spacer"></span>
  <button id="brain">brain off</button>
  <button id="auto">auto</button>
</div>

<main class="brain-off">
  <section class="pane">
    <canvas id="world"></canvas>
    <div class="hud" id="hud"></div>
    <div class="legend">
      <span><s style="background:var(--green)"></s>food</span>
      <span><s id="legadi" style="background:var(--amber)"></s>adi</span>
      <span><s style="background:var(--red)"></s>low energy</span>
    </div>
    <div class="foot">prakriti · the room</div>
    <div class="seatbar">
      <button id="prev">&#9664;</button>
      <select id="seat"></select>
      <button id="next">&#9654;</button>
      <span class="meta" id="seatmeta"></span>
    </div>
  </section>

  <section class="right">
    <div class="card">
      <h3>recurrent state <span id="uinfo">128 units</span></h3>
      <canvas id="units"></canvas>
    </div>
    <div class="card">
      <h3>policy <span id="pinfo"></span></h3>
      <canvas id="policy"></canvas>
    </div>
    <div class="card">
      <h3>attention <span>grad × input</span></h3>
      <canvas id="sal"></canvas>
    </div>
    <div class="card">
      <h3>state map <span>last 360 steps</span></h3>
      <canvas id="map"></canvas>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ACTIONS = ["forward","left","right","eat"];
  let state = null;
  let dirty = true;
  let brainOn = false;
  let lastDraw = 0;
  let seatBuilt = false;
  let lastHeader = 0;
  const prevEaten = new Map();
  const pulseUntil = new Map();
  const sizeCache = new WeakMap();

  // ---------------------------------------------------------------- socket
  let ws = null;
  function connect(){
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = e => {
      try {
        state = JSON.parse(e.data);
        updatePulses(state.roster);
        dirty = true;
      } catch(_){}
    };
    ws.onclose = () => { state = null; setTimeout(connect, 800); };
    ws.onerror = () => { try { ws.close(); } catch(_){} };
  }
  connect();

  function send(o){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function updatePulses(roster){
    if(!roster) return;
    const now = performance.now();
    for(const r of roster){
      const prev = prevEaten.get(r.slot);
      if(prev !== undefined && r.eaten > prev) pulseUntil.set(r.slot, now + 900);
      prevEaten.set(r.slot, r.eaten);
    }
  }

  // ---------------------------------------------------------------- controls
  document.querySelectorAll("[data-speed]").forEach(b => {
    b.onclick = () => send({cmd:"speed", value: parseFloat(b.dataset.speed)});
  });
  $("pause").onclick = () => send({cmd:"pause"});
  $("birthmode").onchange = () => send({cmd:"birth_mode", mode: $("birthmode").value});
  $("maxage").onchange = () => send({cmd:"max_age", value: parseFloat($("maxage").value)});
  $("density").onchange = () => send({cmd:"food_density", value: parseFloat($("density").value)});
  $("cycle").onclick = () => send({cmd:"cycle", value: !(state && state.cycle_on)});
  $("auto").onclick = () => send({cmd:"focus", mode:"auto"});
  $("brain").onclick = () => {
    brainOn = !brainOn;
    document.querySelector("main").classList.toggle("brain-off", !brainOn);
    sizeCache.clear();
    dirty = true;
  };

  function moveSeat(d){
    if(!state || !state.roster) return;
    const n = state.roster.length;
    const cur = state.agent ? state.agent.slot : (state.focus_slot || 0);
    takeSeat((cur + d + n) % n);
  }
  function takeSeat(slot){ send({cmd:"focus", slot}); dirty = true; }
  $("prev").onclick = () => moveSeat(-1);
  $("next").onclick = () => moveSeat(1);
  $("seat").onchange = () => takeSeat(parseInt($("seat").value, 10));

  window.addEventListener("resize", () => { sizeCache.clear(); dirty = true; });
  document.addEventListener("visibilitychange", () => { if(!document.hidden) dirty = true; });

  // ---------------------------------------------------------------- canvas
  function measure(c){
    const r = c.getBoundingClientRect();
    sizeCache.set(c, { w: Math.max(1, Math.floor(r.width)), h: Math.max(1, Math.floor(r.height)) });
  }
  function fit(c){
    let s = sizeCache.get(c);
    if(!s){ measure(c); s = sizeCache.get(c); }
    const dpr = window.devicePixelRatio || 1;
    const W = s.w, H = s.h;
    if (c.width !== Math.floor(W*dpr) || c.height !== Math.floor(H*dpr)){
      c.width = Math.floor(W*dpr); c.height = Math.floor(H*dpr);
    }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    return {ctx,W,H};
  }
  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function text(ctx,s,x,y,color,size=10,align="left"){
    ctx.fillStyle=color; ctx.font=`${size}px ui-monospace,Menlo,monospace`;
    ctx.textAlign=align; ctx.textBaseline="middle"; ctx.fillText(s,x,y);
  }

  // ---------------------------------------------------------------- header
  function drawHeader(){
    if(!state) return;
    const s = state.stats;
    const bits = [
      ["pop", s.pop],
      ["gen", s.max_gen],
      ["step", state.step.toLocaleString()],
      ["births", s.births],
      ["deaths", s.deaths],
      ["best", s.best_eaten.toFixed(0)],
    ];
    $("stats").innerHTML = bits.map(([k,v]) => `<span><i>${k}</i><b>${v}</b></span>`).join("");
    document.querySelectorAll("[data-speed]").forEach(b => {
      const v = parseFloat(b.dataset.speed);
      b.classList.toggle("on", (state.speed === 0 && v === 0) || Math.abs(state.speed - v) < 1e-6);
    });
    $("pause").classList.toggle("on", state.paused);
    $("pause").textContent = state.paused ? "resume" : "pause";
  }

  // ---------------------------------------------------------------- toolbar
  function drawToolbar(){
    if(!state) return;
    $("cycle").textContent = state.cycle_on ? "cycle on" : "cycle off";
    $("cycle").classList.toggle("on", !!state.cycle_on);
    $("phase").textContent = state.cycle_on ? state.cycle_label : "no cycle";
    $("foodnow").textContent = `food ${(state.food_density*100).toFixed(1)}%`;
    $("brain").textContent = brainOn ? "brain on" : "brain off";
    $("brain").classList.toggle("on", brainOn);
    $("auto").classList.toggle("on", state.focus_mode === "auto");

    const den = $("density");
    den.disabled = !!state.cycle_on;
    const fv = String(state.food_density);
    if(!state.cycle_on && [...den.options].some(o => o.value === fv)) den.value = fv;

    const bm = $("birthmode");
    if(bm && bm.value !== (state.birth_mode || "threshold")) bm.value = state.birth_mode || "threshold";
    const ma = $("maxage");
    const mv = String(state.max_age || 0);
    if(ma && [...ma.options].some(o => o.value === mv)) ma.value = mv;
  }

  // ---------------------------------------------------------------- seatbar
  function buildSeats(){
    if(seatBuilt || !state || !state.roster) return;
    const sel = $("seat");
    sel.innerHTML = "";
    for(const r of state.roster){
      const o = document.createElement("option");
      o.value = String(r.slot);
      o.textContent = `${r.slot} ${r.name}`;
      sel.appendChild(o);
    }
    seatBuilt = true;
  }

  function drawSeatbar(){
    if(!state) return;
    buildSeats();
    const a = state.agent;
    const slot = a ? a.slot : state.focus_slot;
    if(slot != null && $("seat").value !== String(slot)) $("seat").value = String(slot);
    if(a){
      $("seatmeta").textContent =
        `${a.name} · gen ${a.gen} · ${a.energy.toFixed(1)} energy · ${a.eaten} eaten · cap ${(a.cap || 0).toFixed(3)}`;
    } else {
      $("seatmeta").textContent = "empty seat";
    }
  }

  // ---------------------------------------------------------------- world
  function drawWorld(){
    const c = $("world");
    const {ctx,W,H} = fit(c);
    if(!state || !state.world || !state.agent){
      text(ctx, "waiting for a line...", W/2, H/2, "#2a3648", 12, "center");
      return;
    }
    const G = state.world.size, a = state.agent, w = state.world;
    const PAD = 18;
    const cell = Math.min((W-2*PAD)/G, (H-2*PAD)/G);
    const ox = (W - cell*G)/2, oy = (H - cell*G)/2;
    const hue = a.hue || 35;
    const vit = a.vitality == null ? 0.5 : a.vitality;
    const pulse = (pulseUntil.get(a.slot) || 0) > performance.now();

    ctx.fillStyle = "#080b10";
    ctx.fillRect(ox, oy, cell*G, cell*G);

    ctx.strokeStyle = "rgba(40,55,75,.18)";
    ctx.lineWidth = 1;
    for(let i=0;i<=G;i+=8){
      ctx.beginPath(); ctx.moveTo(ox+i*cell, oy); ctx.lineTo(ox+i*cell, oy+cell*G); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, oy+i*cell); ctx.lineTo(ox+cell*G, oy+i*cell); ctx.stroke();
    }

    ctx.fillStyle = "#141b26";
    for(const [x,y] of w.walls) ctx.fillRect(ox+x*cell, oy+y*cell, cell+.5, cell+.5);
    ctx.strokeStyle = "rgba(64,86,116,.28)";
    ctx.lineWidth = 1;
    for(const [x,y] of w.walls) ctx.strokeRect(ox+x*cell+.5, oy+y*cell+.5, cell-1, cell-1);

    for(const [x,y,f] of w.food){
      const px = ox+(x+.5)*cell, py = oy+(y+.5)*cell;
      const r = Math.max(1.2, cell*(.10+.22*f));
      ctx.beginPath();
      ctx.fillStyle = `rgba(61,220,151,${.08+.50*f})`;
      ctx.arc(px,py,r,0,6.2832); ctx.fill();
    }

    if(state.trail.length > 1){
      for(let i=1;i<state.trail.length;i++){
        const [x0,y0] = state.trail[i-1], [x1,y1] = state.trail[i];
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${.012+.10*(i/state.trail.length)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(ox+x0*cell, oy+y0*cell);
        ctx.lineTo(ox+x1*cell, oy+y1*cell);
        ctx.stroke();
      }
    }

    const px = ox + a.x*cell, py = oy + a.y*cell;
    for(let i=0;i<8;i++){
      const ang = a.heading + i*Math.PI/4;
      const d = (1 - a.whiskers[i]) * w.range;
      const ex = ox + (a.x + Math.cos(ang)*d)*cell;
      const ey = oy + (a.y + Math.sin(ang)*d)*cell;
      ctx.strokeStyle = `hsla(${hue}, 70%, 65%, ${.12+.42*a.whiskers[i]})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
    }

    const low = a.energy < 20;
    const col = low ? "#ff5f6d" : `hsl(${hue} 85% ${45+20*vit}%)`;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(a.heading);
    const s = Math.max(5, cell*.92);
    ctx.beginPath();
    ctx.moveTo(s,0); ctx.lineTo(-s*.62,s*.55); ctx.lineTo(-s*.32,0); ctx.lineTo(-s*.62,-s*.55);
    ctx.closePath();
    ctx.fillStyle = col;
    if(pulse){ ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.fill();
    ctx.restore();

    const frac = Math.max(0, Math.min(1, a.energy/110));
    ctx.beginPath();
    ctx.arc(px,py,Math.max(7,cell*1.12),-Math.PI/2,-Math.PI/2+frac*6.2832);
    ctx.strokeStyle = low ? "rgba(255,95,109,.95)" : `hsla(${hue}, 80%, 65%, .55)`;
    ctx.lineWidth = 1.6; ctx.stroke();

    text(ctx, a.name, px, py + cell*2.1, `hsla(${hue}, 75%, 72%, .85)`, 9, "center");
  }

  // ---------------------------------------------------------------- panels
  function drawUnits(){
    const c = $("units"), {ctx,W,H} = fit(c);
    if(!state || !state.agent) return;
    const u = state.agent.units;
    const cols = 16, rows = Math.ceil(u.length/cols);
    const gap = 2;
    const cw = (W - gap*(cols-1))/cols, ch = (H - gap*(rows-1))/rows;
    for(let i=0;i<u.length;i++){
      const v = Math.max(-1, Math.min(1, u[i]));
      const x = (i%cols)*(cw+gap), y = Math.floor(i/cols)*(ch+gap);
      if(v >= 0) ctx.fillStyle = `rgba(255,180,84,${.055+.945*v})`;
      else ctx.fillStyle = `rgba(90,169,255,${.055+.945*(-v)})`;
      roundRect(ctx,x,y,cw,ch,1.5); ctx.fill();
    }
  }

  function drawPolicy(){
    const c = $("policy"), {ctx,W,H} = fit(c);
    if(!state || !state.agent) return;
    const a = state.agent, p = a.probs;
    const topH = H*0.56, rowH = topH/4;
    for(let i=0;i<4;i++){
      const y = i*rowH + 2;
      text(ctx, ACTIONS[i], 0, y+rowH/2-1, i===a.action?"#c6d2e2":"#4d5b6e", 9);
      const bx = 54, bw = W-54;
      ctx.fillStyle = "#0a0e14"; roundRect(ctx,bx,y,bw,rowH-5,3); ctx.fill();
      const ww = Math.max(1, bw*p[i]);
      ctx.fillStyle = i===a.action ? "rgba(255,180,84,.92)" : "rgba(90,169,255,.30)";
      roundRect(ctx,bx,y,ww,rowH-5,3); ctx.fill();
      text(ctx, p[i].toFixed(2), bx+4, y+rowH/2-1, i===a.action?"#06080c":"#66758a", 8);
    }
    const e = state.err_hist;
    const y0 = topH + 6, hh = H - y0 - 2;
    ctx.strokeStyle = "rgba(24,33,48,.9)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,y0+hh); ctx.lineTo(W,y0+hh); ctx.stroke();
    if(e.length > 2){
      const mx = Math.max(1e-6, ...e);
      ctx.beginPath();
      for(let i=0;i<e.length;i++){
        const x = (i/(e.length-1))*W;
        const y = y0 + hh - (e[i]/mx)*hh;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.strokeStyle = "rgba(61,220,151,.75)"; ctx.lineWidth = 1.2; ctx.stroke();
      text(ctx, "surprise", W-2, y0+6, "#2f3f52", 8, "right");
    }
  }

  function drawSal(){
    const c = $("sal"), {ctx,W,H} = fit(c);
    if(!state || !state.agent) return;
    const labels = ["whisker","food","grad","heading","energy","action"];
    const v = state.agent.sal;
    const rowH = H/6;
    for(let i=0;i<6;i++){
      const y = i*rowH;
      text(ctx, labels[i], 0, y+rowH/2, "#4d5b6e", 9);
      const bx = 58, bw = W-58-30;
      ctx.fillStyle = "#0a0e14"; roundRect(ctx,bx,y+3,bw,rowH-8,2); ctx.fill();
      const ww = Math.max(1,bw*v[i]);
      const g = ctx.createLinearGradient(bx,0,bx+bw,0);
      g.addColorStop(0,"rgba(90,169,255,.55)"); g.addColorStop(1,"rgba(255,180,84,.90)");
      ctx.fillStyle = g; roundRect(ctx,bx,y+3,ww,rowH-8,2); ctx.fill();
      text(ctx, v[i].toFixed(2), W-2, y+rowH/2, "#3a4a5f", 8, "right");
    }
  }

  function drawMap(){
    const c = $("map"), {ctx,W,H} = fit(c);
    if(!state) return;
    const pts = state.map || [];
    const R = 1.35;
    const px = x => (x + R)/(2*R) * (W-8) + 4;
    const py = y => H - ((y + R)/(2*R) * (H-8) + 4);
    ctx.strokeStyle = "rgba(24,33,48,.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px(-R),py(0)); ctx.lineTo(px(R),py(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(0),py(-R)); ctx.lineTo(px(0),py(R)); ctx.stroke();
    const colors = ["rgba(120,140,165,.55)","rgba(61,220,151,.85)","rgba(90,169,255,.85)","rgba(255,95,109,.95)"];
    for(let i=0;i<pts.length;i++){
      const [x,y,l] = pts[i];
      const t = i/pts.length;
      ctx.beginPath();
      ctx.fillStyle = colors[l] || colors[0];
      ctx.globalAlpha = 0.12 + 0.65*t;
      ctx.arc(px(x),py(y), 1.1 + 1.2*t, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if(pts.length){
      const [x,y] = pts[pts.length-1];
      ctx.beginPath(); ctx.arc(px(x),py(y),3.2,0,6.2832);
      ctx.fillStyle="#fff"; ctx.fill();
      ctx.beginPath(); ctx.arc(px(x),py(y),6,0,6.2832);
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1; ctx.stroke();
    }
    const leg = [["normal","#788ca5"],["food","#3ddc97"],["wall","#5aa9ff"],["low","#ff5f6d"]];
    leg.forEach(([label,col],i)=>{
      ctx.beginPath(); ctx.fillStyle=col; ctx.arc(5, H-6-i*10, 2.2, 0, 6.2832); ctx.fill();
      text(ctx, label, 11, H-6-i*10, "#3a4a5f", 8);
    });
  }

  // ---------------------------------------------------------------- loop
  function frame(ts){
    if(!document.hidden && dirty && ts - lastDraw >= 33){
      lastDraw = ts;
      dirty = false;
      drawHeader();
      drawToolbar();
      drawSeatbar();
      drawWorld();
      if(brainOn){
        drawUnits();
        drawPolicy();
        drawSal();
        drawMap();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
